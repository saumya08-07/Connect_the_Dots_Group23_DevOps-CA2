global:
  scrape_interval: 15s        # how often Prometheus pulls metrics
  evaluation_interval: 15s    # how often alert rules are checked

rule_files:
  - alerts.yml   # resolved relative to this file

scrape_configs:
  - job_name: backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["backend:8080"]     # docker-compose service name
        labels:
          service: connect-the-dots-backend

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
