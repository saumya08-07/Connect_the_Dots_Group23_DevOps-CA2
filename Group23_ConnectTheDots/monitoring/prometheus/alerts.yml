groups:
  - name: connect-the-dots
    rules:
      - alert: BackendDown
        expr: up{job="backend"} == 0
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: "Backend is down"
          description: "Prometheus has not been able to scrape the backend for 1 minute."

      - alert: HighErrorRate
        expr: |
          sum(rate(http_server_requests_seconds_count{job="backend",status=~"5..",uri!~"/actuator.*"}[5m]))
            / sum(rate(http_server_requests_seconds_count{job="backend",uri!~"/actuator.*"}[5m])) > 0.05
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "5xx error rate above 5%"

      - alert: HighLatencyP95
        expr: |
          histogram_quantile(0.95,
            sum by (le) (rate(http_server_requests_seconds_bucket{job="backend",uri!~"/actuator.*"}[5m]))) > 0.5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "p95 latency above 500 ms"
