spring.application.name=backend

# MongoDB (env var SPRING_DATA_MONGODB_URI overrides this; default kept for local runs)
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://mongodb:27017/hackathon}

# Redis
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}

# Cache
spring.cache.type=redis
spring.cache.redis.time-to-live=300000

# MinIO
minio.url=${MINIO_URL:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:admin}
minio.secret-key=${MINIO_SECRET_KEY:password}
minio.bucket=${MINIO_BUCKET:uploads}

# File upload limits
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=50MB

# CORS
allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173}

# ---------------- DevOps: observability ----------------
# Expose only what we need over HTTP: health (k8s probes), info (version), prometheus (metrics)
management.endpoints.web.exposure.include=health,info,prometheus
# Liveness/readiness groups -> /actuator/health/liveness and /actuator/health/readiness
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
# Record latency as a histogram so Grafana can compute p95/p99
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# Tag every metric with the app name
management.metrics.tags.application=connect-the-dots-backend
# Version shown at /actuator/info - set by the pipeline / k8s manifest; lets us SEE rolling updates happen
management.info.env.enabled=true
info.app.name=connect-the-dots-backend
info.app.version=${APP_VERSION:dev}
