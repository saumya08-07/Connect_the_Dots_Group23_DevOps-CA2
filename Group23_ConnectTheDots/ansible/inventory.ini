# Inventory = the list of machines Ansible manages, grouped by role.
[app_servers]
# Option A (used for the demo): the WSL Ubuntu that Ansible itself runs in.
# "local" connection = no SSH needed. Firewall skipped: Windows firewalls the host.
localhost ansible_connection=local enable_firewall=false

# Option B: a remote Ubuntu 22.04/24.04 server (AWS EC2, a VM...). Comment out
# Option A and uncomment this line with your server's IP and key:
# ctd-server-1 ansible_host=192.168.56.10 ansible_user=ubuntu ansible_ssh_private_key_file=~/.ssh/id_rsa

[app_servers:vars]
ansible_python_interpreter=/usr/bin/python3
