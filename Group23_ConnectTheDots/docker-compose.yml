services:

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend/dist:/usr/share/nginx/html:ro
    depends_on:
      - backend
      - minio

  backend:
    build:
      context: ./backend/backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongodb:27017/hackathon
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: "6379"
      MINIO_URL: http://minio:9000
      MINIO_ACCESS_KEY: admin
      MINIO_SECRET_KEY: password
      MINIO_BUCKET: uploads
      JAVA_TOOL_OPTIONS: "-Dspring.data.mongodb.uri=mongodb://mongodb:27017/hackathon -Dspring.data.redis.host=redis"
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started

  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  # S3-compatible object storage. Service is still called "minio" so nginx.conf and the
  # backend's MINIO_* settings keep working, but the image is RustFS: MinIO's official
  # images were deleted from Docker Hub (Sept 2026) and gated on Quay.
  minio:
    image: rustfs/rustfs:latest
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      RUSTFS_ACCESS_KEY: admin
      RUSTFS_SECRET_KEY: password
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - minio_data:/data
  # (minio-init removed: the backend creates the "uploads" bucket itself on first upload)

volumes:
  mongo_data:
  minio_data: