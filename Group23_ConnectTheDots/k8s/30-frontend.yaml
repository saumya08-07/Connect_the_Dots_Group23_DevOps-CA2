apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: connect-the-dots
  labels: {app: frontend}
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: ghcr.io/riya54671/ctd-frontend:latest
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 80, name: http}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 15
          resources:
            requests: {cpu: 50m, memory: 32Mi}
            limits: {memory: 128Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: connect-the-dots
spec:
  type: NodePort                    # reachable from your machine (minikube service / port 30080)
  selector: {app: frontend}
  ports: [{name: http, port: 80, targetPort: http, nodePort: 30080}]
