apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-data
  namespace: connect-the-dots
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: connect-the-dots
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: {app: minio}
  template:
    metadata:
      labels: {app: minio}
    spec:
      # RustFS runs as a non-root user; make sure it can write to the volume
      initContainers:
        - name: fix-permissions
          image: busybox:1.36
          command: ["sh", "-c", "chmod 0777 /data"]
          volumeMounts:
            - {name: data, mountPath: /data}
      containers:
        - name: minio
          # S3-compatible store. MinIO's official images were removed from Docker Hub (Sept 2026);
          # RustFS is an API-compatible drop-in on the same port, so the backend is unchanged.
          image: rustfs/rustfs:latest
          args: ["/data"]
          env:
            - name: RUSTFS_ACCESS_KEY
              valueFrom: {secretKeyRef: {name: minio-credentials, key: MINIO_ACCESS_KEY}}
            - name: RUSTFS_SECRET_KEY
              valueFrom: {secretKeyRef: {name: minio-credentials, key: MINIO_SECRET_KEY}}
            - {name: RUSTFS_ADDRESS, value: ":9000"}
            - {name: RUSTFS_CONSOLE_ADDRESS, value: ":9001"}
            - {name: RUSTFS_CONSOLE_ENABLE, value: "true"}
          ports:
            - {containerPort: 9000, name: api}
            - {containerPort: 9001, name: console}
          readinessProbe:
            httpGet: {path: /health, port: 9000}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /data}
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-data
---
apiVersion: v1
kind: Service
metadata:
  name: minio
  namespace: connect-the-dots
spec:
  selector: {app: minio}
  ports:
    - {name: api, port: 9000, targetPort: 9000}
    - {name: console, port: 9001, targetPort: 9001}
