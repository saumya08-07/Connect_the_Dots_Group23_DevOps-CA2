apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mongo-data
  namespace: connect-the-dots
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongodb
  namespace: connect-the-dots
spec:
  replicas: 1
  strategy:
    type: Recreate               # a single-writer DB volume can't be mounted by 2 pods at once
  selector:
    matchLabels: {app: mongodb}
  template:
    metadata:
      labels: {app: mongodb}
    spec:
      containers:
        - name: mongodb
          image: mongo:7
          ports: [{containerPort: 27017}]
          volumeMounts:
            - {name: data, mountPath: /data/db}
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 512Mi}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mongo-data
---
apiVersion: v1
kind: Service
metadata:
  name: mongodb
  namespace: connect-the-dots
spec:
  selector: {app: mongodb}
  ports: [{port: 27017, targetPort: 27017}]
